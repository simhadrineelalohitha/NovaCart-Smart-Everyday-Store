<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — NovaCart</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/cart.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar__logo">🛒 NovaCart</a>
    <ul class="navbar__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html" class="active">Cart <span id="cart-count" class="cart-badge">0</span></a></li>
      <li><a href="login.html" id="nav-login">Login</a></li>
      <li><a href="register.html" id="nav-register">Register</a></li>
      <li><a href="#" id="nav-logout" style="display:none;">Logout</a></li>
    </ul>
  </nav>

  <main class="container cart-page">
    <h1 class="section-title">Your Cart</h1>
    <div id="cart-container">
      <!-- Cart table injected by cart.js -->
      <p class="loading-text" id="cart-message">Your cart is empty. <a href="products.html">Start shopping</a>.</p>
    </div>
    <div class="cart-summary" id="cart-summary" style="display:none;">
      <p>Total: <strong id="cart-total">$0.00</strong></p>
      <a href="checkout.html" class="btn btn--primary">Proceed to Checkout</a>
    </div>
  </main>

  <footer class="footer">
    <p>© 2024 NovaCart. Built for CodeAlpha Internship.</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>

</body>
</html>
