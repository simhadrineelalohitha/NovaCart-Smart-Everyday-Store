<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NovaCart</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">🛒 NovaCart</a>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to your account</p>

    <!-- Error / success message shown here -->
    <div class="auth-message" id="auth-message"></div>

    <button type="button" class="google-login-button" data-google-login aria-label="Continue with Google">
      <span class="google-login-button__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M21.6 12.23c0-.74-.07-1.46-.2-2.15H12v4.07h5.39a4.6 4.6 0 0 1-2 3.03v2.52h3.24c1.9-1.75 2.97-4.33 2.97-7.47Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.52c-.9.6-2.06.96-3.38.96-2.6 0-4.8-1.76-5.58-4.12H.84v2.6A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.42 19.9A6 6 0 0 1 6 17.3V14.7H2.92A10 10 0 0 0 2 12c0-1.63.39-3.18 1.08-4.54L6.42 10.5A5.95 5.95 0 0 1 6 12c0 1.02.19 2 .54 2.9l-.12.4Z"/>
          <path fill="#EA4335" d="M12 3.98c1.47 0 2.79.5 3.83 1.49l2.88-2.88A9.97 9.97 0 0 0 12 2a10 10 0 0 0-9.08 5.46L6.42 10.5A5.99 5.99 0 0 1 12 3.98Z"/>
        </svg>
      </span>
      <span>Continue with Google</span>
    </button>
    <div class="auth-divider"><span>or use email</span></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" aria-label="Show password" data-password-toggle="password">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full" id="login-btn">
        Log In
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

</body>
</html>
